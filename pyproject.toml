[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-research-lab"
version = "0.1.0"
description = "Strategy-agnostic research platform for Expert Advisor systems under test"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema[format]>=4.26,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ea_research_lab*"]
